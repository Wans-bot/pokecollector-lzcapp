version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: out/pokecollector.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: app
build:
  run_buildscript: false

images:
  - id: app
    target: service
    service: backend
    source: ghcr.io/git-romer/pokecollector-backend
    channel: stable
    tag_regex: '^v?\d+\.\d+\.\d+$'
    sort: semver
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales:
      - zh
      - en
    application:
      language: zh
      brief: "宝可梦卡牌收藏管理"
      description: "自托管的宝可梦卡牌收藏管理器：记录持有卡牌与卡册、追踪价格与收藏进度，支持多用户与统计图表。"
      keywords: "宝可梦, 卡牌, 收藏, 卡册, TCG"
      support_pc: true
      screenshot_pc_files:
        - ".github/screenshots/pc-1.png"
        - ".github/screenshots/pc-2.png"
        - ".github/screenshots/pc-3.png"
  private:
    enabled: false
